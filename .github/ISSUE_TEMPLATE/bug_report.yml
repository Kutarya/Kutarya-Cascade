name: Hata bildirimi
description: Tekrarlanabilir bir hata bildirin
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Hata
      description: Beklenen ve gerçekleşen davranışı yazın.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Yeniden üretim
      description: Sentetik veriyle en küçük yeniden üretim adımlarını paylaşın.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Sürüm
      placeholder: 0.1.0
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Ortam
      description: İşletim sistemi, Python ve llama.cpp sürümü. Gizli veri eklemeyin.
